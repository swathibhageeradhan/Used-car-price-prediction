{% extends "base.html" %}
{% block title %}Error {{ code }} · AutoPrice AI{% endblock %}

{% block content %}
<div class="hero">
    <span class="eyebrow"><span class="pulse"></span> System Fault</span>
    <h1>Error <em>{{ code }}</em></h1>
    <p>{{ message }}</p>
</div>

<div class="wrap">
    <div class="panel" style="max-width:560px;margin:0 auto;text-align:center;">
        <div class="panel-head" style="justify-content:center;">
            <svg viewBox="0 0 24 24"><path d="M12 2 1 21h22L12 2zm1 14h-2v2h2v-2zm0-6h-2v5h2v-5z"/></svg>
            <h2>Request Failed</h2>
        </div>

        <div class="btn-row">
            <a href="{{ url_for('input_form') }}" class="btn-predict">
                <svg viewBox="0 0 24 24"><path d="M13 2 3 14h7l-1 8 10-12h-7l1-8z"/></svg>
                Back to Form
            </a>
            <a href="{{ url_for('index') }}" class="btn-ghost">
                <svg viewBox="0 0 24 24"><path d="M12 2 6 2v20h12V2h-6zm6 18H6V4h7v14l2.5-2.5L17 17v3z"/></svg>
                Home
            </a>
        </div>
    </div>
</div>
{% endblock %}
